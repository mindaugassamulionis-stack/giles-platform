name: Giles Platform CI & Build Verification

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify secret hygiene (no .env files tracked)
        run: |
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '^\.env\.example$'; then
            echo "Tracked .env file detected!"
            exit 1
          fi
          echo "Secret hygiene check passed."

      - name: Verify MCP Server (2025-06-18) syntax & manifest integrity
        run: |
          node --check mcp/giles-mcp-stdio.mjs
          node -e '
            const fs = require("fs");
            for (const f of ["package.json", "tsconfig.json", "messages/lt.json", "messages/en.json"]) {
              JSON.parse(fs.readFileSync(f, "utf8"));
            }
            for (const f of [
              "src/lib/admin-auth-store.ts",
              "src/app/api/admin/auth/route.ts",
              "src/components/giles-admin-auth-bar.tsx",
              "src/components/giles-admin-os.tsx",
              "src/app/api/mcp/route.ts"
            ]) {
              if (!fs.existsSync(f)) throw new Error("Missing core file: " + f);
            }
            console.log("All manifests and core modules verified.");
          '
